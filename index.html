<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Tely — Exercices corrigés et sujets d'examen pour réussir</title>
    <meta
      name="description"
      content="Révisez avec des exercices corrigés, des anciens sujets d'examen (Brevet, BAC) et des corrections détaillées, classés par matière et par niveau. Inscription gratuite."
    />
    <meta name="theme-color" content="#fafafa" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("tely.theme");
          var dark = t === "dark" || ((t === "system" || !t) && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            document.documentElement.classList.add("dark");
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute("content", "#09090b");
          }
        } catch (e) {}
      })();
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tely" />

    <!-- Polices (Bricolage Grotesque, chargée depuis index.css) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Open Graph / Twitter par défaut (mis à jour par page via useSeo) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="Tely" />
    <meta property="og:title" content="Tely — Exercices corrigés et sujets d'examen pour réussir" />
    <meta
      property="og:description"
      content="Exercices corrigés, anciens sujets d'examen et corrections détaillées, du collège au BAC. Inscription gratuite."
    />
    <meta property="og:image" content="/banner3.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tely — Exercices corrigés et sujets d'examen pour réussir" />
    <meta
      name="twitter:description"
      content="Exercices corrigés, anciens sujets d'examen et corrections détaillées, du collège au BAC. Inscription gratuite."
    />
    <meta name="twitter:image" content="/banner3.png" />
  </head>
  <body class="bg-background text-foreground">
    <noscript>Tely nécessite JavaScript pour fonctionner. Activez-le dans votre navigateur.</noscript>
    <div id="root">
      <style>
        .tely-boot{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#fafafa;color:#0b1120;font-family:system-ui,-apple-system,sans-serif}
        html.dark .tely-boot{background:#09090b;color:#f8fafc}
        @keyframes telyBootDraw{0%{stroke-dashoffset:100;opacity:.2}38%{stroke-dashoffset:0;opacity:1}68%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:-100;opacity:.2}}
        .tely-boot-a{stroke-dasharray:100;stroke-dashoffset:100;animation:telyBootDraw 1.85s cubic-bezier(.65,0,.35,1) infinite}
        .tely-boot-b{stroke-dasharray:100;stroke-dashoffset:100;animation:telyBootDraw 1.85s cubic-bezier(.65,0,.35,1) .22s infinite}
      </style>
      <div class="tely-boot" role="status" aria-label="Chargement de Tely">
        <svg viewBox="0 0 64 56" width="60" height="52" fill="none" aria-hidden="true">
          <path d="M23.5 22.5H14.5C9.8 22.5 7 19.3 7 15.2C7 11.1 10.2 8 15.2 8H20.5C30 8 36.8 14.8 36.8 24.5V40.5C36.8 45.8 34.4 49 32 49" stroke="currentColor" stroke-opacity=".12" stroke-width="7.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M40.5 22.5H49.5C54.2 22.5 57 19.3 57 15.2C57 11.1 53.8 8 48.8 8H43.5C34 8 27.2 14.8 27.2 24.5V40.5C27.2 45.8 29.6 49 32 49" stroke="#F59E0B" stroke-opacity=".16" stroke-width="7.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path pathLength="100" class="tely-boot-a" d="M23.5 22.5H14.5C9.8 22.5 7 19.3 7 15.2C7 11.1 10.2 8 15.2 8H20.5C30 8 36.8 14.8 36.8 24.5V40.5C36.8 45.8 34.4 49 32 49" stroke="currentColor" stroke-width="7.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path pathLength="100" class="tely-boot-b" d="M40.5 22.5H49.5C54.2 22.5 57 19.3 57 15.2C57 11.1 53.8 8 48.8 8H43.5C34 8 27.2 14.8 27.2 24.5V40.5C27.2 45.8 29.6 49 32 49" stroke="#F59E0B" stroke-width="7.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span style="font-size:18px;font-weight:800;letter-spacing:-.03em;opacity:.85">tely</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
